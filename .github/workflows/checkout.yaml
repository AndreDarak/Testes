name: Checkout
on: [push]

jobs:
  Checkout-and-display-files:
    runs-on: ubuntu-latest
    steps:
      - name: List Files Before
        run: | 
          ls -a
          echo $GITHUB_REPOSITORY
        
      - name: Checkout
        run: |
          git clone "https://$GITHUB_ACTOR:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY .git"
          git fetch origin
          git checkout main
      - name: List Files After
        run: ls -a 


