name: Repository Events
on: 
  push:
    branches:
      - "!feature/featA" #Ignora essa branch
      - main
      - "feature/*" # Matches feature/nome_da_feature
      - "feature/**" # Matches feature/nome_da_feature/nome_da_feature
   # branches-ignore:
   #   - develop
    tags:
      - v1.*
      - "!v1.1.1"
    paths:
      - "**.py"
      - "!app.py"

  pull_request:
    types: [opened,assigned,reopened,synchronize]
    branches:
      - main
    paths:
      - "**.py"
  issues:
    types: [opened]

jobs:
  Checkout-test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo $GITHUB_SHA
          echo $GITHUB_REF
      - uses: actions/checkout@v4
      
