openapi: 3.0.0
info:
  title: Minha API
  description: Documentação da API gerada automaticamente
  version: 1.0.0
servers:
  - url: https://api.exemplo.com
paths:
  /usuarios:
    get:
      summary: Retorna a lista de usuários
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    nome:
                      type: string
                      example: "Usuário Exemplo"
  /mensagem:
    get:
      summary: Retorna uma mensagem
      responses:
        '200':
          description: Mensagem de saudação
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensagem:
                    type: string
                    example: "Ola Dani O Boy"
